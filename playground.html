<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code Detective · Playground</title>
<link rel="icon" href="./favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="./playground.css">
<style>
:root{--bg-primary:#0d1117;--bg-secondary:#111720;--border:#303b4d;--text-primary:#fff;--text-secondary:#b6becf;--text-muted:#7b8798;--text-code:#fff;--cyan:#00f3ff;--purple:#9b5de5;--green:#00ff88;--amber:#ffb700;--crimson:#ff2e63;--font-ui:'Inter',sans-serif;--font-code:'Fira Code',monospace;--bg-terminal:#0e1117;--surface-subtle:rgba(255,255,255,.04);--shadow-card:0 4px 24px rgba(0,0,0,.4);--radius-md:10px}
body[data-theme=light]{--bg-primary:#f5f7fb;--bg-secondary:#fff;--border:#d9e2ee;--text-primary:#142033;--text-secondary:#475569;--text-muted:#64748b;--text-code:#0f172a;--bg-terminal:#f8fafc;--surface-subtle:rgba(15,23,42,.04);--shadow-card:0 18px 38px rgba(15,23,42,.1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-ui);min-height:100vh;overflow-x:hidden}body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,243,255,.008) 2px,rgba(0,243,255,.008) 4px)}
.topbar{position:sticky;top:0;z-index:1000;height:64px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(7,11,17,.9);backdrop-filter:blur(20px)}body[data-theme=light] .topbar{background:rgba(255,255,255,.9)}.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.3}.topbar-actions{display:flex;gap:8px;align-items:center}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:10px;border:1px solid var(--border);background:var(--surface-subtle);color:var(--text-primary);font:600 12px var(--font-ui);text-decoration:none;cursor:pointer;transition:.2s ease}.btn:hover{transform:translateY(-2px);border-color:rgba(0,243,255,.35)}.btn-primary{background:linear-gradient(135deg,var(--cyan),#0088ff);border-color:transparent;color:#071018;box-shadow:0 0 20px rgba(0,243,255,.2)}.btn-ghost{background:var(--surface-subtle)}.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}.badge-cyan{background:rgba(0,243,255,.08);color:var(--cyan);border:1px solid rgba(0,243,255,.18)}.badge-amber{background:rgba(255,183,0,.08);color:var(--amber);border:1px solid rgba(255,183,0,.18)}.badge-green{background:rgba(0,255,136,.08);color:var(--green);border:1px solid rgba(0,255,136,.18)}.badge-purple{background:rgba(155,93,229,.08);color:var(--purple);border:1px solid rgba(155,93,229,.18)}.badge-crimson{background:rgba(255,46,99,.08);color:var(--crimson);border:1px solid rgba(255,46,99,.18)}
</style>
</head>
<body>
<header class="topbar"><a class="playground-brand" href="./home.html"><span class="playground-brand-mark">🔎</span><span>CODE <span style="color:var(--cyan)">DETECTIVE</span></span></a><div class="topbar-actions"><a class="btn btn-ghost" href="./home.html">← Back to HQ</a></div></header>
<main class="playground-page" id="playground-root"><div class="playground-loading">Loading Playground…</div></main>
<script type="module" src="./playground.js"></script>
</body>
</html>
