<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Detective | Reset Password</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px;font-family:Inter,Arial,sans-serif;color:#fff;background:radial-gradient(circle at 20% 20%,rgba(245,185,66,.10),transparent 30%),radial-gradient(circle at 80% 80%,rgba(201,146,28,.10),transparent 30%),#0E1117}
    .card{width:100%;max-width:430px;padding:34px;border:1px solid #303B4D;border-radius:22px;background:rgba(27,34,48,.96);box-shadow:0 0 50px rgba(245,185,66,.08)}
    .logo{text-align:center;font-size:34px;margin-bottom:10px}.brand{text-align:center;font-size:27px;font-weight:800}.gold{color:#F5B942}
    .subtitle{margin:10px 0 28px;text-align:center;color:#7B8798;line-height:1.5}
    .field{margin-bottom:17px}.field label{display:block;margin-bottom:7px;color:#B6BECF;font-size:13px;font-weight:700}
    input{width:100%;padding:14px;border:1px solid #303B4D;border-radius:10px;outline:none;color:#fff;background:#222B3A}
    input:focus{border-color:#F5B942;box-shadow:0 0 0 3px rgba(245,185,66,.10)}
    .submit{width:100%;margin-top:5px;padding:14px;border:0;border-radius:10px;cursor:pointer;color:#0E1117;background:#F5B942;font-size:15px;font-weight:900}
    .submit:disabled{opacity:.6;cursor:not-allowed}
    .message{display:none;margin-top:18px;padding:12px;border-radius:9px;font-size:13px;line-height:1.5}
    .message.error{display:block;color:#FF5D73;border:1px solid rgba(255,93,115,.25);background:rgba(255,93,115,.08)}
    .message.success{display:block;color:#38D39F;border:1px solid rgba(56,211,159,.25);background:rgba(56,211,159,.08)}
    .back{display:block;margin:16px auto 0;border:0;background:transparent;color:#8fa3b7;cursor:pointer;font:inherit;font-size:12px}
    .back:hover{color:#F5B942}
    .footer{margin-top:25px;text-align:center;color:#53667a;font-size:12px}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🕵️‍♂️</div>
    <div class="brand">Code<span class="gold">Detective</span></div>
    <p class="subtitle">Create a new password for your detective account.</p>

    <form id="resetForm">
      <div class="field">
        <label for="newPassword">NEW PASSWORD</label>
        <input id="newPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Minimum 6 characters" required>
      </div>
      <div class="field">
        <label for="confirmPassword">CONFIRM PASSWORD</label>
        <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Enter the password again" required>
      </div>
      <button id="resetBtn" class="submit" type="submit">UPDATE PASSWORD</button>
    </form>

    <div id="message" class="message" role="status" aria-live="polite"></div>
    <button id="backToLogin" class="back hidden" type="button">← Return to login</button>
    <div class="footer">SECURE DETECTIVE AUTHENTICATION • CODE DETECTIVE</div>
  </main>
  <script type="module" src="./reset-password.js"></script>
</body>
</html>
